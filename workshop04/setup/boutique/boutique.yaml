---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boutique-httproute
spec:
  hostnames:
  #TODO: change the GATEWAY_IP to gateway IP address
  # - boutique-GATEWAY_IP.nip.io
  - boutique.146.190.5.112.nip.io
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path: 
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80

