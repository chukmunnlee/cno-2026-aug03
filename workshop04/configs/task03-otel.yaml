extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    # view /debug/tracez
    endpoint: 0.0.0.0:55679

processors:
  batch: {}
  memory_limiter:
    limit_mib: 1024
    spike_limit_mib: 410
    check_interval: 5

receivers:
  prometheus: 
    config:
      scrape_configs:
      - job_name: k8s-pods
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        # workshop04;true
        - source_labels: [ __meta_kubernetes_namespace, __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
          regex: workshop04;true
          action: keep
        # 10.10.7.7:7000;9464 => 10.10.7.7:9464
        - source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
          regex: (.+):(\d+);(\d+)
          action: replace
          target_label: __address__
          replacement: $1:$3
        - source_labels: [ __meta_kubernetes_pod_ready ]
          regex: (.+)
          action: replace
          target_label: k8s_pod_ready
          replacement: $1
        - source_labels: [ __meta_kubernetes_pod_phase ]
          regex: (.+)
          action: replace
          target_label: k8s_pod_phase
          replacement: $1
        #- source_labels: [ __meta_kubernetes_namespace ]
        #  regex: workshop04
        #  action: keep
        ## annotations:
        ##   prometheus.io/scrape: 'true'
        #- source_labels: [ __meta_kubernetes_pod_annotations_prometheus_io_scrape ]
        #  regex: true
        #  action: keep

exporters:
  prometheus_remote_write: 
    endpoint: http://prom-stack-kube-prometheus-prometheus.prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    # basic, normal, detailed
    verbosity: detailed
    sampling_initial: 1
    sampling_thereafter: 100

service:
  extensions: [ health_check, zpages ]
  pipelines:
    metrics:
      receivers: [ prometheus ]
      processors: [ batch, memory_limiter ]
      exporters: [ prometheus_remote_write, debug ]
