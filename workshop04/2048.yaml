---
apiVersion: v1
kind: Namespace
metadata:
  name: game

---
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: game 
  namespace: game 
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: game
      env: dev
  # pod template
  template:
    metadata: 
      labels: 
        app: game
        env: dev
    spec: 
      containers: 
      - name: game 
        image: chukmunnlee/2048:v1 
        ports:
        - containerPort: 8080

--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: game 
  namespace: game 
spec: 
  # clusterip, nodeport, loadbalancer, externalname
  type: ClusterIP
  selector:
    app: game
    env: dev
  ports:
  - port: 80 
    targetPort: 8080
