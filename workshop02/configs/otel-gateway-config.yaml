extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    # view /debug/tracez
    endpoint: 0.0.0.0:55679

processors:
  batch:
  memory_limiter:
    limit_mib: 2048
    spike_limit_mib: 410
    check_interval: 5

  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
    - name: slow-spans
      type: latency
      latency:
        threshold_ms: 1000
    - name: error-spans
      type: status_code
      status_code:
        status_codes: 
        - ERROR
    - name: sample-10-percent
      type: probabilistic
      probabilistic:
        sampling_percentage: 10

receivers:

  otlp:
    protocols:
      grpc: 
        endpoint: 0.0.0.0:4317
      http: 
        endpoint: 0.0.0.0:4318

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: detailed
    sampling_initial: 1
    sampling_thereafter: 100

service:
  extensions: [ health_check, zpages ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch, tail_sampling, memory_limiter ]
      exporters: [ otlp/tempo, debug ]
